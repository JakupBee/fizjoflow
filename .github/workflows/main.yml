name: Twice Daily Cloudflare Build

on:
  schedule:
    # This standard cron syntax runs at 08:00 and 20:00 UTC every day
    - cron: '0 8,20 * * *'
  workflow_dispatch: # This adds a manual "Run workflow" button in GitHub just in case!

# NAPRAWA OSTRZEŻENIA NODE.JS: Wymusza użycie nowej wersji Node 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  trigger-build:
    runs-on: ubuntu-latest

    # NAPRAWA BŁĘDU 128: Nadajemy botowi uprawnienia do zrobienia "git push"
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Push empty commit to trigger Cloudflare
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Auto-trigger Cloudflare Build"
          git push