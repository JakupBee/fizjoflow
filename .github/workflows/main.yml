name: Twice Daily Contentful Fetch & Build

on:
  schedule:
    - cron: '0 8,20 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and fetch data
        working-directory: ./json
        env:
          # Skrypt pobierze te wartości z bezpiecznego sejfu GitHuba
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
        run: |
          npm install
          node fetch_data.js

      - name: Commit and push updated JSONs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. Najpierw dodajemy pobrane przed chwilą pliki JSON
          git add json/*.json
          
          # 2. Sprawdzamy, czy w ogóle nastąpiły jakieś zmiany w plikach
          if git diff --staged --quiet; then
            echo "Brak nowych lub zmienionych danych z Contentful. Pomijam aktualizację."
          else
            # 3. Jeśli są zmiany, najpierw je zapisujemy (commitujemy)
            git commit -m "Auto-update: pobrano nowe dane z Contentful"
          
            # 4. TERAZ pobieramy nowości z serwera, unikając błędu o niezapisanych plikach
            git pull --rebase origin master
          
            # 5. Wysyłamy całość na GitHuba
            git push origin HEAD:master
          fi